spring.application.name=tasty-and-tochka

spring.r2dbc.url=${R2DBC_URL}
spring.r2dbc.username=${POSTGRES_USER}
spring.r2dbc.password=${POSTGRES_PASSWORD}

spring.liquibase.url=${DB_URL}
spring.liquibase.user=${POSTGRES_USER}
spring.liquibase.password=${POSTGRES_PASSWORD}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

logging.level.root=${LOG_LEVEL:INFO}
logging.level.ru.gusev.tastyandtochka=${APP_LOG_LEVEL:INFO}
